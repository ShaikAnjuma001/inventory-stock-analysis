<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}StockWise{% endblock %} - StockWise</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<header><b>StockWise</b>
<nav>{% set ep = request.endpoint %}
<a href="{{ url_for('dashboard') }}" class="{{ 'on' if ep=='dashboard' }}">Dashboard</a>
<a href="{{ url_for('products') }}" class="{{ 'on' if ep=='products' }}">Products</a>
<a href="{{ url_for('suppliers') }}" class="{{ 'on' if ep=='suppliers' }}">Suppliers</a>
<a href="{{ url_for('transactions') }}" class="{{ 'on' if ep=='transactions' }}">Stock movements</a>
<a href="{{ url_for('reports') }}" class="{{ 'on' if ep=='reports' }}">Reports</a></nav></header>
<main>
{% with m = get_flashed_messages(with_categories=true) %}{% for c, t in m %}<div class="msg {{ c }}" role="status">{{ t }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</main></body></html>
